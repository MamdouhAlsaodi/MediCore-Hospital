openapi: 3.1.0
info:
  title: MediCore Hospital API
  description: "Generated contract for the demonstrated MediCore route families: auth,\
    \ patients, appointments, admissions, command-center dashboard, and audit. MediCore\
    \ is an educational Training/Portfolio system operating on synthetic data only:\
    \ it is non-clinical and makes no production, regulatory, or availability claim.\
    \ Every authenticated operation rides the single server-issued bearer token; scope\
    \ and authority are server-owned. Client errors use the shared ApiError body;\
    \ security refusals (401/403) use one generic non-enumerating error body."
  version: v1
servers:
- url: /
  description: Same-origin review deployment
security:
- bearerAuth: []
tags:
- name: auth
  description: Login and authenticated acting-context switch
- name: patients
  description: Patient registry within the acting branch
- name: appointments
  description: Booked appointment windows within the acting branch
- name: admissions
  description: Admission lifecycle and atomic bed assignment
- name: dashboard
  description: Command-center reads for the acting branch/organization
- name: audit
  description: Scope-aware audit evidence reads (ADMIN only)
paths:
  /api/patients/{id}:
    get:
      tags:
      - patient-controller
      operationId: getPatient
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "401":
          description: "Missing, invalid, or expired bearer token; the acting session\
            \ is gone. The body is one generic non-enumerating error field."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: authentication required
                required:
                - error
        "403":
          description: The authenticated acting context is not permitted to use this
            operation. The body is one generic non-enumerating error field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: authentication required
                required:
                - error
        "400":
          description: A path value is malformed for its typed target (shared ApiError
            body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No resource referenced by the path exists inside the acting
            scope (shared ApiError body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - patient-controller
      operationId: updatePatient
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "401":
          description: "Missing, invalid, or expired bearer token; the acting session\
            \ is gone. The body is one generic non-enumerating error field."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: authentication required
                required:
                - error
        "403":
          description: The authenticated acting context is not permitted to use this
            operation. The body is one generic non-enumerating error field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: authentication required
                required:
                - error
        "400":
          description: "Malformed request body, malformed field value, or a failed\
            \ validation constraint (shared ApiError body)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No resource referenced by the path exists inside the acting
            scope (shared ApiError body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admissions/{id}/status:
    put:
      tags:
      - admission-controller
      operationId: dischargeAdmission
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdmissionStatusRequest"
        required: true
      responses:
        "200":
          description: "The discharged admission (status DISCHARGED, held bed released)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionResponse"
        "409":
          description: The requested transition is not legal from the admission's
            current status (shared ApiError body; the admission is unchanged).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "Missing, invalid, or expired bearer token; the acting session\
            \ is gone. The body is one generic non-enumerating error field."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: authentication required
