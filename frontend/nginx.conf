# MediCore review-stack nginx (plan Task 6; Phase 4 T063): static SPA with
# fallback plus same-origin /api routing to the backend service. The hardened
# header set applies to every response — note nginx add_header inheritance:
# a location-level add_header REPLACES the server-level set, so the full set
# is repeated in every response block. server_tokens stay off; no credentials
# appear here. The SPA CSP allows exactly what the built app uses (self-hosted
# scripts/styles/fonts/images, same-origin connections, inline style
# attributes for React's CSSOM styling) and forbids frames, objects, and
# everything else; the API CSP (strict default-src 'none') lives in
# SecurityConfig and reaches browsers through this same-origin proxy.
server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the SPA shell; hashed assets are immutable.
    location / {
        try_files $uri /index.html;
    }
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }

    # Same-origin API path: the browser only ever talks to this origin.
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # Forward the request's Host header WITH its port. The backend's
        # fail-closed CORS posture compares the browser Origin against the
        # request Host; $host strips the port and would make every same-origin
        # POST look cross-origin (403). $http_host preserves the exact origin.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_pass_request_headers on;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
}
