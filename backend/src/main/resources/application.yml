spring:
  application:
    name: medicore-hospital
  main:
    # Phase 4 observability (plan Task 8, T054; FR-007): the console is the
    # single structured log stream; the startup banner prints directly to
    # stdout OUTSIDE the logging system and would inject one non-JSON line
    # into it, so it stays off and the stream remains purely structured.
    banner-mode: off
  datasource:
    url: jdbc:h2:file:./data/medicore;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  # Phase 4 isolation (plan Task 2, step 5): the lightweight H2 developer
  # profile keeps Hibernate schema management and explicitly disables
  # Flyway. The PostgreSQL review profile (application-postgres.yml) is the
  # only Flyway-managed profile; no profile silently inherits migration
  # behavior from another.
  flyway:
    enabled: false
# Phase 4 observability (plan Task 8, T051/T052/T055; FR-008/FR-010):
# liveness stays process-only, readiness requires the database, and exactly
# the required review endpoints (health + Prometheus) are web-exposed —
# every other actuator endpoint remains unexposed AND authenticated.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
hospital:
  jwt:
    secret: ${HOSPITAL_JWT_SECRET}
    ttl-minutes: 60
server:
  address: 127.0.0.1
  port: 5501
# Synthetic demo data seeding (Task 11): disabled by default.
# Set MEDICORE_DEMO_SEED=true only for a local demo environment. When enabled,
# startup inserts a small idempotent synthetic cohort (patients DEMO-0001..0003,
# professionals DEMO-STAFF-001..002, two appointments). It never deletes or
# modifies existing rows and creates no accounts or credentials; no real or
# secret values belong in this file.
medicore:
  demo:
    seed: ${MEDICORE_DEMO_SEED:false}
  # Opt-in review accounts (training/review environments only): disabled by
  # default. With MEDICORE_REVIEW_ACCOUNTS_ENABLED=true, startup creates the
  # doctor/nurse review accounts only if absent, using the runtime-only
  # HOSPITAL_REVIEW_DOCTOR_PASSWORD and HOSPITAL_REVIEW_NURSE_PASSWORD
  # variables; existing accounts are never modified. No real or secret values
  # belong in this file.
  review-accounts:
    enabled: ${MEDICORE_REVIEW_ACCOUNTS_ENABLED:false}
