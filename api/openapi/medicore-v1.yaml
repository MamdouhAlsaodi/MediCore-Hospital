  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: The verified acting-context session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: "Invalid credentials, disabled account, or no valid acting\
            \ assignment. The body is one generic non-enumerating error field."
          content:
            application/json:
              schema:
                type: object
        "429":
          description: Too many failed attempts from the requesting address. The body
            is one generic non-enumerating error field.
          headers:
            Retry-After:
              description: Seconds until the address may retry
              style: simple
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Malformed request body, malformed field value, or a failed\
            \ validation constraint (shared ApiError body)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
  /api/auth/context:
