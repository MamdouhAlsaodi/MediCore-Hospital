openapi: 3.1.0
info:
  title: MediCore Phase 5 Contract Additions
  version: 0.5.0-draft
  description: >-
    Planning contract for synthetic enterprise hospital network operations.
    It is not a production, clinical, regulatory, or deployment contract.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/network/hierarchy:
    get:
      operationId: getAuthorizedNetworkHierarchy
      responses:
        '200':
          description: Hierarchy filtered to the server-derived acting authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkHierarchy'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/context:
    post:
      operationId: switchHierarchicalActingContext
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextSwitchRequest'
      responses:
        '200':
          description: Replacement session bound to one hospital and branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/transfers:
    get:
      operationId: listAuthorizedTransfers
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransferStatus'
      responses:
        '200':
          description: Transfers visible to the acting source/destination scope
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransferView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: requestTransfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: Transfer created in REQUESTED state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/transfers/{transferId}:
    get:
      operationId: getAuthorizedTransfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Transfer visible to the acting scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/transfers/{transferId}/accept:
    post:
      operationId: acceptTransfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptTransferRequest' }
      responses:
        '200':
          description: Accepted transfer with an atomic destination bed reservation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/transfers/{transferId}/reject:
    post:
      operationId: rejectTransfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionReasonRequest' }
      responses:
        '200':
          description: Rejected transfer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/transfers/{transferId}/cancel:
    post:
      operationId: cancelTransfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionReasonRequest' }
      responses:
        '200':
          description: Cancelled transfer; owned reservation released if present
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/transfers/{transferId}/start-transit:
    post:
      operationId: startTransferTransit
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Transfer moved to IN_TRANSIT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/transfers/{transferId}/complete:
    post:
      operationId: completeTransfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Completed transfer with destination admission and consumed reservation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/capacity/branch:
    get:
      operationId: getActingBranchCapacity
      responses:
        '200':
          description: Capacity for the acting branch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacitySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/capacity/hospital:
    get:
      operationId: getActingHospitalCapacity
      responses:
        '200':
          description: Capacity summed over active authorized branches in the acting hospital
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HospitalCapacitySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/capacity/network:
    get:
      operationId: getAuthorizedNetworkCapacity
      responses:
        '200':
          description: Capacity summed over authorized hospitals and branches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HospitalCapacitySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    BadRequest:
      description: Malformed or invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Missing, invalid, expired, or stale session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Generic non-enumerating refusal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource unavailable inside the acting scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Illegal transition, unavailable resource, duplicate, or idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
    HospitalView:
      type: object
      required: [id, code, name, regionLabel, timeZone, active, branches]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 160 }
        regionLabel: { type: string, maxLength: 160 }
        timeZone: { type: string, maxLength: 60 }
        active: { type: boolean }
        branches:
          type: array
          items: { $ref: '#/components/schemas/BranchView' }
    BranchView:
      type: object
      required: [id, hospitalId, code, name, timeZone, active]
      properties:
        id: { type: string, format: uuid }
        hospitalId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        timeZone: { type: string }
        active: { type: boolean }
    NetworkHierarchy:
      type: object
      required: [organizationId, organizationCode, organizationName, hospitals]
      properties:
        organizationId: { type: string, format: uuid }
        organizationCode: { type: string }
        organizationName: { type: string }
        hospitals:
          type: array
          items: { $ref: '#/components/schemas/HospitalView' }
    ContextSwitchRequest:
      type: object
      required: [assignmentId, hospitalId, branchId]
      properties:
        assignmentId: { type: string, format: uuid }
        hospitalId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
    SessionContext:
      type: object
      required: [accessToken, tokenType, username, roles, assignments, actingContext]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        username: { type: string }
        roles: { type: array, minItems: 1, maxItems: 1, items: { type: string } }
        assignments: { type: array, items: { type: object } }
        actingContext:
          type: object
          required: [assignmentId, role, scope, organizationId, hospitalId, branchId]
          properties:
            assignmentId: { type: string, format: uuid }
            role: { type: string }
            scope: { type: string, enum: [ORGANIZATION, HOSPITAL, BRANCH, DEPARTMENT] }
            organizationId: { type: string, format: uuid }
            hospitalId: { type: string, format: uuid }
            branchId: { type: string, format: uuid }
            departmentId: { type: [string, 'null'], format: uuid }
    TransferStatus:
      type: string
      enum: [REQUESTED, ACCEPTED, IN_TRANSIT, COMPLETED, REJECTED, CANCELLED]
    CreateTransferRequest:
      type: object
      required: [patientId, sourceAdmissionId, destinationHospitalId, reasonCode]
      properties:
        patientId: { type: string, format: uuid }
        sourceAdmissionId: { type: string, format: uuid }
        destinationHospitalId: { type: string, format: uuid }
        reasonCode: { type: string, minLength: 1, maxLength: 40 }
    AcceptTransferRequest:
      type: object
      required: [destinationBranchId, destinationBedId, expectedVersion]
      properties:
        destinationBranchId: { type: string, format: uuid }
        destinationBedId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 0 }
    TransitionReasonRequest:
      type: object
      required: [reasonCode, expectedVersion]
      properties:
        reasonCode: { type: string, minLength: 1, maxLength: 40 }
        expectedVersion: { type: integer, minimum: 0 }
    TransferView:
      type: object
      required: [id, transferNumber, patientId, sourceHospitalId, sourceBranchId, destinationHospitalId, status, requestedAt, version]
      properties:
        id: { type: string, format: uuid }
        transferNumber: { type: string }
        patientId: { type: string, format: uuid }
        sourceHospitalId: { type: string, format: uuid }
        sourceBranchId: { type: string, format: uuid }
        destinationHospitalId: { type: string, format: uuid }
        destinationBranchId: { type: [string, 'null'], format: uuid }
        destinationBedId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/TransferStatus' }
        requestedAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        transitStartedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 0 }
    CapacitySummary:
      type: object
      required: [branchId, bedsAvailable, bedsReservedForTransfer, bedsOccupied, appointmentsScheduled]
      properties:
        branchId: { type: string, format: uuid }
        bedsAvailable: { type: integer, minimum: 0 }
        bedsReservedForTransfer: { type: integer, minimum: 0 }
        bedsOccupied: { type: integer, minimum: 0 }
        appointmentsScheduled: { type: integer, minimum: 0 }
    HospitalCapacitySummary:
      type: object
      required: [hospitalId, bedsAvailable, bedsReservedForTransfer, bedsOccupied, appointmentsScheduled, branches]
      properties:
        hospitalId: { type: string, format: uuid }
        bedsAvailable: { type: integer, minimum: 0 }
        bedsReservedForTransfer: { type: integer, minimum: 0 }
        bedsOccupied: { type: integer, minimum: 0 }
        appointmentsScheduled: { type: integer, minimum: 0 }
        branches:
          type: array
          items: { $ref: '#/components/schemas/CapacitySummary' }
