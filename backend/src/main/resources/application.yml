spring:
  application:
    name: medicore-hospital
  datasource:
    url: jdbc:h2:file:./data/medicore;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
hospital:
  jwt:
    secret: ${HOSPITAL_JWT_SECRET}
    ttl-minutes: 60
server:
  address: 127.0.0.1
  port: 5501
