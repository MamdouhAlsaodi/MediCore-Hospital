              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: "The switch to the requested assignment is refused (unknown,\
            \ disabled, or out-of-scope target). Shared ApiError body with a controlled,\
            \ non-widening message."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "Missing, invalid, or expired bearer token; the acting session\
