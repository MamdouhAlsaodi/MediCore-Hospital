# Phase 4 PostgreSQL review profile (plan Task 2). Schema authority is
# Flyway; Hibernate only validates. All connection values are environment
# placeholders WITHOUT defaults: the profile fails closed when a required
# variable is missing instead of silently connecting somewhere. Secrets and
# credential values never belong in this tracked file (FR-001).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Phase 4 (plan Task 8, T051): database acquisition is bounded so the
      # readiness probe answers responsively while PostgreSQL is unavailable
      # instead of hanging on the pool's long default wait.
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
# Phase 4 (plan Task 8, T051): on the PostgreSQL review profile readiness
# requires the database in addition to the process readiness state; liveness
# stays process-only (inherited from application.yml) so dependency loss
# never turns into a false dead process. Migration state gates STARTUP
# itself: Flyway runs before the application context (and therefore before
# readiness exists to answer), and Boot 3.5 ships no Flyway health
# contributor, so there is nothing further to add to the group.
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
# Phase 4 security hardening (plan Task 9, T062; FR-010): the review profile
# states its cross-origin policy EXPLICITLY and fail-closed — the allowlist
# is empty unless an operator deliberately sets MEDICORE_CORS_ALLOWED_ORIGINS.
# The review frontend is same-origin (nginx /api route), so no cross-origin
# origin is required for the demonstrated journey. The bounded login rate
# limiter inherits the profile-independent defaults from application.yml.
hospital:
  security:
    cors:
      allowed-origins: ${MEDICORE_CORS_ALLOWED_ORIGINS:}
