# MediCore review-stack nginx (plan Task 6): static SPA with fallback plus
# same-origin /api routing to the backend service. Security headers apply to
# every response; server tokens stay off; no credentials appear here.
server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the SPA shell; hashed assets are immutable.
    location / {
        try_files $uri /index.html;
    }
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Same-origin API path: the browser only ever talks to this origin.
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_pass_request_headers on;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
