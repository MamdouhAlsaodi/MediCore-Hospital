name: MediCore Phase 5 PostgreSQL proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/src/main/resources/db/migration/**'
      - 'backend/src/test/java/com/mamtrex/hospital/infrastructure/**'
      - 'backend/src/main/java/com/mamtrex/hospital/patient/**'
      - 'backend/src/main/java/com/mamtrex/hospital/transfer/**'
      - 'backend/src/main/java/com/mamtrex/hospital/idempotency/**'
      - 'backend/pom.xml'
      - 'api/openapi/medicore-v1.yaml'
      - 'frontend/src/generated/api/**'
      - 'scripts/phase4/lib-openapi.sh'
      - 'scripts/phase4/generate-openapi-client.mjs'
      - '.github/workflows/phase5-postgres.yml'

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PostgreSQL-backed integration suites (V7 migration, transfer races, MRN races, Flyway, profile, db-loss)
        run: |
          cd backend
          mvn -B test -Dtest='FlywayPostgresIntegrationTest,Phase5MigrationIntegrationTest,PostgresConcurrencyIntegrationTest,PostgresProfileContextIntegrationTest,LivenessReadinessDbLossIntegrationTest,NetworkPatientConcurrencyIntegrationTest,TransferConcurrencyIntegrationTest,TransferV7IntegrityIntegrationTest'
      - name: Served OpenAPI and generated-client byte drift (disposable Docker backend)
        run: scripts/phase4/check-openapi-drift.sh
      - name: Summarize
        if: always()
        run: |
          cd backend
          grep -h 'Tests run' target/surefire-reports/*.txt | awk -F'[:,]' '{t+=$2; f+=$4; e+=$6} END {printf "postgres suites: tests=%d failures=%d errors=%d\n", t, f, e}'
