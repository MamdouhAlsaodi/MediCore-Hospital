                    example: authentication required
                required:
                - error
        "403":
          description: The authenticated acting context is not permitted to use this
            operation. The body is one generic non-enumerating error field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: authentication required
                required:
                - error
        "400":
          description: "Malformed request body, malformed field value, or a failed\
            \ validation constraint (shared ApiError body)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No resource referenced by the path exists inside the acting
